spring.application.name=bitacora-sistema
server.port=8080

# Base vacía de prueba, no la original
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/bitacora_espacios?connectionTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MariaDBLegacyDialect

# Configuración de Flyway
spring.flyway.enabled = true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}