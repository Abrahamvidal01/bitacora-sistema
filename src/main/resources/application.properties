spring.application.name=bitacora-sistema
server.port=8080

# Base vacía de prueba, no la original
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bitacora_espacios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Flyway
spring.flyway.enabled = true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1