<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Solicitudes - Bitácora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar Superior -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-primary" href="#">
            <i class="bi bi-calendar-event me-2"></i>Reservas de Espacios
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-muted small"><i class="bi bi-person me-1"></i> Usuario Docente</span>
            <a th:href="@{/login?logout}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">Mis Solicitudes de Reservación</h4>
        <button class="btn btn-primary fw-bold shadow-sm"><i class="bi bi-plus-circle me-1"></i> Nueva Solicitud</button>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Espacio</th>
                        <th>Fecha Reservada</th>
                        <th>Horario</th>
                        <th>Estatus</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="fw-bold">Audiovisual 1</td>
                        <td>25/Sep/2026</td>
                        <td>08:00 - 10:00 hrs</td>
                        <td><span class="badge bg-warning text-dark">Pendiente</span></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">Sala Magna</td>
                        <td>10/Sep/2026</td>
                        <td>11:00 - 13:00 hrs</td>
                        <td><span class="badge bg-success">Aprobado</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
