<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seleccionar bitácora</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Sistema de Bitácoras</span>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
                Cerrar Sesión
            </button>
        </form>
    </div>
</nav>

<main class="container py-5">
    <h1 class="h3 mb-2">Bitácoras</h1>
    <p class="text-muted mb-4">Selecciona el módulo que deseas utilizar.</p>

    <div class="row g-4">
        <div class="col-md-6">
            <section class="card h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5">Espacios académicos</h2>
                    <p class="text-muted">
                        Gestión de espacios, inventario y reservas.
                    </p>
                    <a th:href="@{/panel}" class="btn btn-primary">
                        Entrar
                    </a>
                </div>
            </section>
        </div>

        <div class="col-md-6">
            <section class="card h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5">Parque vehicular</h2>
                    <p class="text-muted">
                        Este módulo se incorporará posteriormente.
                    </p>
                    <button type="button"
                            class="btn btn-secondary"
                            disabled>
                        Próximamente
                    </button>
                </div>
            </section>
        </div>
    </div>
</main>

</body>
</html>
