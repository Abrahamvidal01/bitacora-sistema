<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Espacios académicos - Seleccionar panel</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Espacios académicos</span>

        <div class="d-flex gap-2">
            <a th:href="@{/bitacoras}"
               class="btn btn-outline-light btn-sm">
                Bitácoras
            </a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="h3">Selecciona tu panel</h1>
    <p class="text-muted mb-4">
        Tu cuenta tiene varios roles. Elige dónde deseas trabajar.
    </p>

    <div class="row g-4">

        <div th:if="${administrador}" class="col-md-4">
            <section class="card h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5">Administrador</h2>
                    <a th:href="@{/admin/dashboard}"
                       class="btn btn-primary mt-3">
                        Entrar
                    </a>
                </div>
            </section>
        </div>

        <div th:if="${supervisor}" class="col-md-4">
            <section class="card h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5">Supervisor</h2>
                    <a th:href="@{/supervisor/dashboard}"
                       class="btn btn-primary mt-3">
                        Entrar
                    </a>
                </div>
            </section>
        </div>

        <div th:if="${solicitante}" class="col-md-4">
            <section class="card h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5">Solicitante</h2>
                    <a th:href="@{/solicitante/dashboard}"
                       class="btn btn-primary mt-3">
                        Entrar
                    </a>
                </div>
            </section>
        </div>

    </div>
</main>

</body>
</html>
