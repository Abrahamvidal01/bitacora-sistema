<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Inventario del espacio</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Inventario de espacios</span>

        <div class="d-flex gap-2">
            <a th:href="@{/admin/dashboard}"
               class="btn btn-outline-light btn-sm">
                Volver a espacios
            </a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">

    <h1 class="h3" th:text="${espacio.nombreEspacio}">
        Nombre del espacio
    </h1>

    <p class="text-muted" th:text="${espacio.ubicacion}">
        Ubicación
    </p>

    <div th:if="${espacio.activo != true}"
         class="alert alert-warning">
        Este espacio está desactivado.
    </div>

    <!-- Mensajes del registro -->
    <div th:if="${exito != null}"
         class="alert alert-success"
         role="status"
         th:text="${exito}">
    </div>

    <div th:if="${error != null}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <!-- Formulario para registrar un artículo -->
    <section class="card border-0 shadow-sm mb-4"
             aria-labelledby="tituloNuevoArticulo">

        <div class="card-header bg-white py-3">
            <h2 id="tituloNuevoArticulo"
                class="h5 mb-0"
                th:text="${edicionId != null
              ? 'Editar artículo'
              : 'Nuevo artículo'}">
                Nuevo artículo
            </h2>
        </div>

        <div class="card-body">
            <form th:action="${edicionId != null}
        ? @{/admin/espacios/{espacioId}/inventario/{articuloId}/editar(
                espacioId=${espacio.id},
                articuloId=${edicionId})}
        : @{/admin/espacios/{espacioId}/inventario(
                espacioId=${espacio.id})}"
                  method="post">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombreItem"
                               class="form-label fw-bold">
                            Nombre del artículo
                        </label>

                        <input type="text"
                               id="nombreItem"
                               name="nombreItem"
                               class="form-control"
                               maxlength="150"
                               placeholder="Ej. Bancos"
                               th:value="${nombreForm}"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label for="cantidad"
                               class="form-label fw-bold">
                            Cantidad
                        </label>

                        <input type="number"
                               id="cantidad"
                               name="cantidad"
                               class="form-control"
                               min="1"
                               max="2147483647"
                               step="1"
                               th:value="${cantidadForm != null
                                      ? cantidadForm : '1'}"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label for="estadoBien"
                               class="form-label fw-bold">
                            Estado del artículo
                        </label>

                        <input type="text"
                               id="estadoBien"
                               name="estadoBien"
                               class="form-control"
                               maxlength="50"
                               placeholder="Ej. BUENO"
                               th:value="${estadoForm != null
                                      ? estadoForm : 'BUENO'}"
                               required>
                    </div>

                    <div class="col-12">
                        <label for="descripcion"
                               class="form-label fw-bold">
                            Descripción — opcional
                        </label>

                        <textarea id="descripcion"
                                  name="descripcion"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Ej. Bancos metálicos para laboratorio"
                                  th:text="${descripcionForm}"></textarea>
                    </div>
                </div>

                <div class="mt-3 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${edicionId != null
                      ? 'Guardar cambios'
                      : 'Guardar artículo'}">
                        Guardar artículo
                    </button>

                    <a th:if="${edicionId != null}"
                       th:href="@{/admin/espacios/{id}/inventario(id=${espacio.id})}"
                       class="btn btn-outline-secondary">
                        Cancelar edición
                    </a>
                </div>
            </form>
        </div>
    </section>



    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h2 class="h5 mb-0">Materiales y dispositivos</h2>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Artículo</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(articulos)}">
                    <td colspan="5"
                        class="text-center text-muted py-4">
                        Este espacio todavía no tiene inventario registrado.
                    </td>
                </tr>

                <tr th:each="articulo : ${articulos}">
                    <td class="fw-bold"
                        th:text="${articulo.nombreItem}">
                    </td>

                    <td th:text="${articulo.descripcion == null
                                ? 'Sin descripción'
                                : articulo.descripcion}">
                    </td>

                    <td th:text="${articulo.cantidad}"></td>

                    <td th:text="${articulo.estadoBien}"></td>

                    <td>
                        <a th:href="@{/admin/espacios/{espacioId}/inventario/{articuloId}/editar(
                    espacioId=${espacio.id},
                    articuloId=${articulo.id})}"
                           class="btn btn-sm btn-outline-primary">
                            Editar
                        </a>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

</body>
</html>
